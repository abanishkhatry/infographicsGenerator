[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biosurveillance_analytics"
version = "0.1.0"
description = "A pipeline for transforming biosurveillance data from REDCap according to CDC submission guidelines."
readme = "README.rst"
authors = [
  {name = "Caitlin Murphy", email = "caitlin.murphy@dhs.wisconsin.gov"}
]
maintainers = [
  {name = "Caitlin Murphy", email = "caitlin.murphy@dhs.wisconsin.gov"}
]
classifiers = [

]
dependencies = [
  "typer"
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "ruff"  # linting
]

[project.urls]
homepage = "https://github.com/murphcaemk/biosurveillance_analytics/src/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
biosurveillance_analytics = ['data/*.csv']





# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

